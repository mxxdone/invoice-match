spring:
  application:
    name: core-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/invoice_match}
    username: ${DB_USER:invoice_match}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

purchasing-system:
  base-url: ${PURCHASING_BASE_URL:http://localhost:8082}
  connect-timeout: ${PURCHASING_CONNECT_TIMEOUT:2s}
  read-timeout: ${PURCHASING_READ_TIMEOUT:3s}

# Phase 1 in-process payment export relay.
#
# Fail-closed: the scheduler is disabled until an environment explicitly opts in
# (PAYMENT_EXPORT_RELAY_ENABLED=true or payment-export.relay.enabled). P1-09 makes
# mock-erp an idempotent receiver that ACKs by idempotency key and emits a signed
# result webhook, so local/compose may opt in; the deployable default stays off.
# The sending lease must exceed the total request deadline plus a positive safety
# margin (request-timeout + safety-margin), validated at startup. Lease times come
# from PostgreSQL clock_timestamp(), not the JVM clock.
payment-export:
  relay:
    enabled: ${PAYMENT_EXPORT_RELAY_ENABLED:false}
    base-url: ${ERP_BASE_URL:http://localhost:8081}
    connect-timeout: ${PAYMENT_EXPORT_CONNECT_TIMEOUT:1s}
    request-timeout: ${PAYMENT_EXPORT_REQUEST_TIMEOUT:3s}
    lease-duration: ${PAYMENT_EXPORT_LEASE_DURATION:30s}
    safety-margin: ${PAYMENT_EXPORT_SAFETY_MARGIN:5s}
    batch-size: ${PAYMENT_EXPORT_BATCH_SIZE:20}
    interval: ${PAYMENT_EXPORT_INTERVAL:2s}
    max-attempts: ${PAYMENT_EXPORT_MAX_ATTEMPTS:3}
    retry-backoff: ${PAYMENT_EXPORT_RETRY_BACKOFF:5s}

# Request body policy. The limit is enforced by reading the stream, so it also
# bounds chunked bodies without a Content-Length.
http:
  request:
    max-body-bytes: ${HTTP_MAX_BODY_BYTES:262144}
    # The machine result endpoint carries a bounded document-parse-v1 JSON body.
    analysis-result-max-body-bytes: ${HTTP_ANALYSIS_RESULT_MAX_BODY_BYTES:4259840}

# Signed mock-ERP result webhook (P1-09). A blank secret fails closed: every
# webhook is rejected. The tolerance bounds replay of a captured signed request.
mock-erp:
  webhook:
    provider: ${MOCK_ERP_PROVIDER:mock-erp}
    secret: ${MOCK_ERP_WEBHOOK_SECRET:}
    signature-tolerance: ${MOCK_ERP_WEBHOOK_TOLERANCE:5m}

# Demo identities intentionally live only in the 'local' profile
# (application-local.yml) and the test profile, never in the default deployable
# configuration. With no configured identities the API fails closed (401).

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

# P2-05 analysis reservation and P2-06 RabbitMQ relay.
#
# Reservation is fail-closed: no AnalysisRun or analysis-request Outbox row is
# reserved unless an environment explicitly opts in. This only gates new
# reservations; a newer submission still stales lower evidence versions.
#
# Relay is separately fail-closed: no scheduler, no RabbitMQ connection and no
# broker health call run unless ANALYSIS_RELAY_ENABLED=true. Broker credentials
# are environment-only (blank by default) and fail closed when the relay is
# enabled with an empty username/password. Lease/attempt times use DB time; the
# lease always exceeds the bounded single-attempt deadline.
analysis:
  ai:
    enabled: ${ANALYSIS_AI_ENABLED:false}
    lease-duration: ${ANALYSIS_AI_LEASE_DURATION:120s}
  request:
    enabled: ${ANALYSIS_REQUEST_ENABLED:false}
  # P2-07 machine worker surface and execution lease.
  #
  # The internal surface is fail-closed: no machine request is authenticated
  # until ANALYSIS_WORKER_ENABLED=true and a non-empty ANALYSIS_WORKER_TOKEN of at
  # least 32 characters is provided. The token is compared in constant time and
  # is never logged, defaulted or stored. Loopback development boundary only;
  # production exposure requires HTTPS.
  worker:
    enabled: ${ANALYSIS_WORKER_ENABLED:false}
    token: ${ANALYSIS_WORKER_TOKEN:}
  execution:
    lease-duration: ${ANALYSIS_EXECUTION_LEASE_DURATION:120s}
  relay:
    enabled: ${ANALYSIS_RELAY_ENABLED:false}
    lease-duration: ${ANALYSIS_RELAY_LEASE_DURATION:60s}
    retry-delay: ${ANALYSIS_RELAY_RETRY_DELAY:30s}
    batch-size: ${ANALYSIS_RELAY_BATCH_SIZE:10}
    interval: ${ANALYSIS_RELAY_INTERVAL:5s}
    rabbit:
      host: ${ANALYSIS_RABBIT_HOST:localhost}
      port: ${ANALYSIS_RABBIT_PORT:5672}
      vhost: ${ANALYSIS_RABBIT_VHOST:/}
      username: ${ANALYSIS_RABBIT_USERNAME:}
      password: ${ANALYSIS_RABBIT_PASSWORD:}
      exchange: ${ANALYSIS_RABBIT_EXCHANGE:invoice.analysis}
      queue: ${ANALYSIS_RABBIT_QUEUE:invoice.analysis.requests}
      routing-key: ${ANALYSIS_RABBIT_ROUTING_KEY:document-parser-v1}

document-storage:
  enabled: ${DOCUMENT_STORAGE_ENABLED:false}
  endpoint: ${DOCUMENT_STORAGE_ENDPOINT:http://localhost:9000}
  public-endpoint: ${DOCUMENT_STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${DOCUMENT_STORAGE_ACCESS_KEY:}
  secret-key: ${DOCUMENT_STORAGE_SECRET_KEY:}
  bucket: ${DOCUMENT_STORAGE_BUCKET:invoice-documents}
  region: ${DOCUMENT_STORAGE_REGION:us-east-1}
