spring:
  application:
    name: core-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/invoice_match}
    username: ${DB_USER:invoice_match}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

purchasing-system:
  base-url: ${PURCHASING_BASE_URL:http://localhost:8082}
  connect-timeout: ${PURCHASING_CONNECT_TIMEOUT:2s}
  read-timeout: ${PURCHASING_READ_TIMEOUT:3s}

# Local, non-production demo identities for HTTP Basic. Passwords are
# placeholders for local development and tests only; a real deployment replaces
# this UserDetailsService with an IdP/OAuth resource server. See README.
security:
  demo:
    users:
      - username: ${DEMO_SUBMITTER_USERNAME:submitter}
        password: "{noop}${DEMO_SUBMITTER_PASSWORD:submitter-pass}"
        roles: [SUBMITTER]
      - username: ${DEMO_SUBMITTER2_USERNAME:submitter2}
        password: "{noop}${DEMO_SUBMITTER2_PASSWORD:submitter2-pass}"
        roles: [SUBMITTER]
      - username: ${DEMO_APPROVER_USERNAME:approver}
        password: "{noop}${DEMO_APPROVER_PASSWORD:approver-pass}"
        roles: [APPROVER]
      - username: ${DEMO_OPERATOR_USERNAME:operator}
        password: "{noop}${DEMO_OPERATOR_PASSWORD:operator-pass}"
        roles: [OPERATOR]


management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
