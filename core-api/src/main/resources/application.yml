spring:
  application:
    name: core-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/invoice_match}
    username: ${DB_USER:invoice_match}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

purchasing-system:
  base-url: ${PURCHASING_BASE_URL:http://localhost:8082}
  connect-timeout: ${PURCHASING_CONNECT_TIMEOUT:2s}
  read-timeout: ${PURCHASING_READ_TIMEOUT:3s}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
