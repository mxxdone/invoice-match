# TEST ONLY identities. Active only under the Spring 'test' profile bound by
# AbstractPostgresIntegrationTest, so tests can exercise real HTTP Basic
# authentication without the demo credentials being part of the default
# deployable configuration. Same BCrypt hashes as the local profile.
# The relay scheduler never runs in tests; integration tests drive the relay
# deterministically and assert exact states. Timeouts stay below the lease.
payment-export:
  relay:
    enabled: false
    connect-timeout: 500ms
    request-timeout: 2s
    lease-duration: 30s
    safety-margin: 1s

# P1-09 webhook contract for tests. The integration tests sign with this secret;
# production/local must supply MOCK_ERP_WEBHOOK_SECRET or the endpoint fails closed.
mock-erp:
  webhook:
    provider: mock-erp
    secret: test-webhook-secret
    signature-tolerance: 5m

