services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: invoice_match
      POSTGRES_USER: invoice_match
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice_match -d invoice_match"]
      interval: 5s
      timeout: 3s
      retries: 12

  core-api:
    build: ./core-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/invoice_match
      DB_USER: invoice_match
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PURCHASING_BASE_URL: http://mock-purchasing:8082
      ERP_BASE_URL: http://mock-erp:8081
      # P1-09 makes mock-erp an idempotent receiver (ACK by idempotency key plus a
      # signed result webhook), so the relay is intentionally opted in here. The
      # deployable default in application.yml stays fail-closed (false).
      PAYMENT_EXPORT_RELAY_ENABLED: "true"
      MOCK_ERP_WEBHOOK_SECRET: ${MOCK_ERP_WEBHOOK_SECRET:?Set MOCK_ERP_WEBHOOK_SECRET in .env}
      SPRING_PROFILES_ACTIVE: local
      TZ: UTC
    ports:
      - "${CORE_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mock-purchasing:
        condition: service_healthy
      mock-erp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  web:
    build: ./web
    environment:
      TZ: UTC
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  mock-erp:
    build: ./mock-erp
    environment:
      TZ: UTC
      # Processed exports emit a signed result webhook back to core-api.
      WEBHOOK_URL: http://core-api:8080/webhooks/mock-erp/payment-results
      WEBHOOK_SECRET: ${MOCK_ERP_WEBHOOK_SECRET:?Set MOCK_ERP_WEBHOOK_SECRET in .env}
    ports:
      - "${MOCK_ERP_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

  mock-purchasing:
    build: ./mock-purchasing
    environment:
      TZ: UTC
    ports:
      - "${MOCK_PURCHASING_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
