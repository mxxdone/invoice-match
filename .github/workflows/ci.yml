name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  document-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Private document storage acceptance
        run: node scripts/verify-p2-00.mjs
      - name: Storage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-storage-evidence
          path: output/p2-00/**/evidence.json
          if-no-files-found: warn

  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parser dependencies and package wheel
        working-directory: ai-worker
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps .
      - name: Parser tests (real Linux child resource limits)
        working-directory: ai-worker
        run: python -m pytest tests -v
      - name: Installed package CLI smoke (no PYTHONPATH)
        run: |
          python -c "import ai_worker; print('import ok', ai_worker.PARSER_VERSION)"
          ai-worker version
          python -c "import sys; sys.path.insert(0, 'ai-worker/tests'); from fixtures import build_pdf; open('/tmp/smoke.pdf', 'wb').write(build_pdf(['가나다', None]))"
          SIZE=$(stat -c %s /tmp/smoke.pdf)
          SHA=$(sha256sum /tmp/smoke.pdf | cut -d' ' -f1)
          ai-worker parse /tmp/smoke.pdf --document-id smoke --media-type application/pdf --size-bytes "$SIZE" --sha256 "$SHA" > /tmp/isolated.json
          python -c "import json; d=json.load(open('/tmp/isolated.json')); assert d['kind']=='pdf' and d['pdf']['pages'][0]['text']=='가나다'; print('cli smoke ok')"

  checks:
    runs-on: ubuntu-latest
    env:
      # Disposable CI-only credential. Local and deployed environments must provide their own value.
      POSTGRES_PASSWORD: ci-only-not-for-production
      # Disposable CI-only webhook secret for the signed mock-ERP result webhook.
      MOCK_ERP_WEBHOOK_SECRET: ci-only-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Backend tests and build
        working-directory: core-api
        run: |
          docker build --progress=plain -t invoice-match-minio:p2-security-2025-10-15 ../infra/minio
          ./gradlew --no-daemon clean test bootJar
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web install, lint, test, and build
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Mock ERP test
        working-directory: mock-erp
        run: npm test
      - name: Mock purchasing test
        working-directory: mock-purchasing
        run: npm test
      - name: Compose config and images
        run: |
          docker compose config --quiet
          docker compose build
          docker build --progress=plain -t invoice-match-ai-worker:ci ai-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analysis consumer acceptance (real services)
        env:
          WORKER_RUNTIME_IMAGE: invoice-match-ai-worker:ci
        run: node scripts/verify-p2-08.mjs
      - name: Analysis acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-consumer-evidence
          path: output/p2-08/**
          if-no-files-found: warn
      - name: Compose smoke
        run: |
          docker compose up -d --wait
          curl --fail --silent http://localhost:8080/actuator/health
          curl --fail --silent http://localhost:3000/api/health
          curl --fail --silent http://localhost:8081/health
          curl --fail --silent http://localhost:8082/health
          curl --fail --silent http://localhost:8082/api/purchase-orders/PO-1001
          docker compose exec -T postgres psql -U invoice_match -d invoice_match -Atc "SELECT current_setting('TimeZone')"
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Compose
        if: always()
        run: docker compose down -v
