name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Backend tests and build
        working-directory: core-api
        run: ./gradlew --no-daemon clean test bootJar
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web install, lint, test, and build
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Mock ERP test
        working-directory: mock-erp
        run: npm test
      - name: Generate ephemeral database password
        run: echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Compose config and images
        run: |
          docker compose config --quiet
          docker compose build
      - name: Compose smoke
        run: |
          docker compose up -d --wait
          curl --fail --silent http://localhost:8080/actuator/health
          curl --fail --silent http://localhost:3000/api/health
          curl --fail --silent http://localhost:8081/health
          docker compose exec -T postgres psql -U invoice_match -d invoice_match -Atc "SELECT current_setting('TimeZone')"
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Compose
        if: always()
        run: docker compose down -v
